# Asks the portal to carry out scheduled publishing: flipping an article live
# at the time you chose, and sending its newsletter once StaticHost has
# actually rebuilt. The portal does the work and holds the state; this only
# knocks on the door, because a scheduler cannot hold a passkey.
#
# Every 15 minutes is enough: publishing "at 09:00" means "at 09:00 or a few
# minutes after", and the site takes a minute or two to rebuild anyway.
# Note GitHub disables scheduled workflows in a repository with no activity
# for 60 days — the portal also runs anything due whenever it is opened, so a
# missed window delays rather than loses.
name: Scheduled publishing

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the portal to run what is due
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          test -n "$CRON_TOKEN" || { echo "::error::CRON_TOKEN is not set"; exit 1; }
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_TOKEN" \
            https://admin.loconsole.eu/api/cron)
          echo "HTTP $code"
          # The token is wrong or missing if this 404s: the route denies its own
          # existence rather than admitting it to an unauthenticated caller.
          test "$code" = "200" || { echo "::error::the portal refused ($code)"; cat body.json; exit 1; }
          cat body.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("body.json", "utf8"));
            for (const s of r.published) console.log(`::notice::published ${s}`);
            for (const s of r.announced) console.log(`::notice::newsletter sent for ${s}`);
            for (const f of r.failed) console.log(`::warning::${f.slug}: ${f.error}`);
          '
