name: Deploy Admin Portal

# Scoped to admin/** the same way deploy-functions.yml is scoped to functions/**.
# StaticHost builds the Hugo site independently and is untouched by this.
on:
  push:
    branches: [main]
    # static/css and static/fonts are included because the portal derives its
    # look from them: restyling the site should restyle the portal.
    paths: ["admin/**", "static/css/**", "static/fonts/**", "static/img/logo.svg"]
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud/loconsole-admin
  IMAGE: admin
  SCW_NAMESPACE: loconsole-admin
  SCW_CONTAINER: admin
  SCW_REGION: fr-par

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - working-directory: admin
        run: npm ci
      # Reads the real content/blog and content/gallery from the checkout, so a
      # front-matter serializer regression blocks the deploy rather than
      # silently shipping and breaking Hugo's FR/IT placeholder pages.
      - working-directory: admin
        run: npm test
      # Boots the production build against a throwaway copy of the site and
      # drives it over HTTP: sign-in enforcement, CSRF, saving, uploads,
      # translations, deletion. Nearly every serious bug found while building
      # the portal lived in the seams these exercise and the unit tests miss.
      - name: Integration tests (real app, throwaway site copy)
        working-directory: admin
        run: npm run test:integration
      # Fails on a known high-severity vulnerability in a dependency that ships.
      - name: Dependency audit
        working-directory: admin
        run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "$REGISTRY" -u nologin --password-stdin

      # Built from the repository root: the portal derives its fonts, logo and
      # colours from the site's static/ files at build time. The allow-list in
      # admin/Dockerfile.dockerignore keeps the content images out of the build.
      - name: Build and push
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build -f admin/Dockerfile -t "$REGISTRY/$IMAGE:$TAG" -t "$REGISTRY/$IMAGE:latest" .
          docker push "$REGISTRY/$IMAGE:$TAG"
          docker push "$REGISTRY/$IMAGE:latest"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install Scaleway CLI
        run: curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sudo sh

      - name: Point the container at the new image
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        run: |
          set -euo pipefail
          NS_ID=$(scw container namespace list region="$SCW_REGION" -o json \
            | jq -r --arg n "$SCW_NAMESPACE" '.[] | select(.name==$n) | .id')
          if [ -z "$NS_ID" ]; then
            echo "::error::namespace $SCW_NAMESPACE not found in $SCW_REGION"; exit 1
          fi

          C_ID=$(scw container container list namespace-id="$NS_ID" region="$SCW_REGION" -o json \
            | jq -r --arg n "$SCW_CONTAINER" '.[] | select(.name==$n) | .id')
          if [ -z "$C_ID" ]; then
            echo "::error::container $SCW_CONTAINER does not exist yet."
            echo "::error::Its environment holds the app secrets and is created once by hand,"
            echo "::error::so CI never needs them. See admin/DEPLOY.md."
            exit 1
          fi

          # Only the image changes here. Env vars and secrets live in Scaleway
          # and are deliberately not managed from CI. Setting `image` is itself
          # what triggers a new deployment — the CLI has no `redeploy` flag, and
          # the argument is `image`, not `registry-image`.
          scw container container update "$C_ID" region="$SCW_REGION" \
            image="$REGISTRY/$IMAGE:$TAG"

          # A silent no-op here is what let four deploys appear to succeed while
          # the container stayed on an old image, so confirm the swap took.
          RUNNING=$(scw container container get "$C_ID" region="$SCW_REGION" -o json | jq -r '.image')
          echo "container image is now: $RUNNING"
          case "$RUNNING" in
            *":$TAG") ;;
            *) echo "::error::image did not change (still $RUNNING)"; exit 1 ;;
          esac

          for i in $(seq 1 30); do
            STATUS=$(scw container container get "$C_ID" region="$SCW_REGION" -o json | jq -r '.status')
            echo "status: $STATUS"
            case "$STATUS" in
              ready) echo "deployed $TAG"; exit 0 ;;
              error) scw container container get "$C_ID" region="$SCW_REGION" -o json | jq -r '.error_message'; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::timed out waiting for the container to become ready"; exit 1
