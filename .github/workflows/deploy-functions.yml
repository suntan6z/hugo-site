name: Deploy Scaleway Functions

on:
  push:
    branches: [main]
    paths: ["functions/**"]
  # GitHub only compares the first 300 changed files against `paths`, so a big
  # commit (a batch of photos, say) that also touches functions/ can skip this
  # workflow silently. That is how contact.js sat undeployed after 3d8b417.
  # Run it by hand from the Actions tab whenever functions/ changed.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALTCHA_SECRET: ${{ secrets.ALTCHA_SECRET }}
      CONFIRM_SECRET: ${{ secrets.CONFIRM_SECRET }}
      # The newsletter's lists, one Resend segment per language: repository *variables*,
      # not secrets (an id is not a credential). Unset ones are left out; see newsletter.js.
      RESEND_SEGMENT_EN: ${{ vars.RESEND_SEGMENT_EN }}
      RESEND_SEGMENT_FR: ${{ vars.RESEND_SEGMENT_FR }}
      RESEND_SEGMENT_IT: ${{ vars.RESEND_SEGMENT_IT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test functions
        working-directory: functions
        run: npm test

      # Pinned and verified, not the vendor's get.sh: that script asks the
      # unauthenticated GitHub API for "latest", which is rate-limited on shared
      # runner IPs and made this step (and so the deploy) fail at random.
      - name: Install Scaleway CLI
        env:
          SCW_VERSION: "2.65.1"
          SCW_SHA256: "b9ced8bc52c27baba76136a24e65a5e0abd53e9499edf02226513977d45da503"
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o scw \
            "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}/scaleway-cli_${SCW_VERSION}_linux_amd64"
          echo "${SCW_SHA256}  scw" | sha256sum -c -
          sudo install -m 0755 scw /usr/local/bin/scw
          scw version

      - name: Deploy functions
        working-directory: functions
        run: ./deploy.sh
