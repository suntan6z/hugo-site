<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- Same theme bootstrap as the site's baseof.html: an explicit choice in
		     localStorage wins, otherwise follow the system. Runs before paint so
		     there is no light flash in dark mode. -->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
		<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/brand/favicon.png" type="image/png" />
		<link rel="preload" href="/brand/fonts/dmsans-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/brand/fonts/fraunces-600-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
